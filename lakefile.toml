name = "datastar"
version = "0.1.0"
description = "Lean 4 SDK for Datastar: real-time hypermedia over server-sent events."
homepage = "https://github.com/carlohamalainen/datastar-lean"
keywords = ["datastar", "hypermedia", "sse", "http", "web"]
license = "MIT"
builtinLint = true
testDriver = "UnitTests"
defaultTargets = ["Datastar", "hello-world", "hello-world-channel", "activity-feed", "e2e-server", "sdk-test-server"]

[[lean_lib]]
name = "Datastar"

[[lean_exe]]
name = "hello-world"
root = "Examples.HelloWorld"

[[lean_exe]]
name = "hello-world-channel"
root = "Examples.HelloWorldChannel"

[[lean_exe]]
name = "activity-feed"
root = "Examples.ActivityFeed"

# Serves the page that the Playwright tests in e2e/ drive.
[[lean_exe]]
name = "e2e-server"
root = "Test.E2EServer"

# Serves `/test` for the official SDK test suite, run by scripts/test-sdk.sh.
[[lean_exe]]
name = "sdk-test-server"
root = "Test.SdkTestServer"

# `lake test`: the `#guard` checks in Test/Unit.lean run when it compiles.
[[lean_lib]]
name = "UnitTests"
roots = ["Test.Unit"]
